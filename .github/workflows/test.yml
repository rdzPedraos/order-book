name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Tests and coverage (85% per logic package)
        run: |
          pkgs=$(go list -f '{{if ne .Name "main"}}{{.ImportPath}}{{end}}' ./... | grep -vE '/(migrations|models)$')
          go test -cover $pkgs | awk '{ print } /coverage:/ { match($0, /[0-9.]+%/); c = substr($0, RSTART, RLENGTH - 1); if (c + 0 < 85) { low = 1 } } END { exit low }'

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Cyclomatic complexity
        run: go tool gocyclo -over 9 .

      - name: Package comments
        run: "! go list -f '{{if not .Doc}}{{.ImportPath}}{{end}}' ./... | grep ."
